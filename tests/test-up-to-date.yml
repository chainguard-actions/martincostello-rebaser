name: Test rebase up-to-date branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - id: rebase
        uses: .
        with:
          user-email: "test@example.com"
          user-name: "Test User"

      - name: Assert result is upToDate or success
        env:
          ACTUAL: ${{ steps.rebase.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "upToDate" ] && [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected 'upToDate' or 'success', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
