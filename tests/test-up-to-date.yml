name: Test rebase up-to-date
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git repo with two branches at same commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a 'main' branch pointing at the same commit as act-harness
          git branch -f main HEAD

      - id: action
        uses: .
        with:
          branch: main
          user-email: test@example.com
          user-name: Test User

      - name: Assert result is upToDate
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "upToDate" ]; then
            echo "FAIL: expected 'upToDate' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
