name: Test with explicit branch specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a git repository with two branches
        run: |
          mkdir -p /tmp/branch-repo
          cd /tmp/branch-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > README.md
          git add README.md
          git commit -m "Initial commit"
          git checkout -b main
          echo "main content" > main.txt
          git add main.txt
          git commit -m "Add main content"
          git checkout -b feature
          echo "feature content" > feature.txt
          git add feature.txt
          git commit -m "Add feature content"
      - id: action
        uses: .
        with:
          repository: '/tmp/branch-repo'
          branch: 'main'
          user-email: 'test@example.com'
          user-name: 'Test User'
      - name: Assert result is a valid value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "upToDate" ] && [ "$ACTUAL" != "success" ] && [ "$ACTUAL" != "conflicts" ] && [ "$ACTUAL" != "error" ]; then
            echo "FAIL: expected a valid result value, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
