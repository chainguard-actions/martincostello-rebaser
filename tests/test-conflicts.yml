name: Test rebase conflicts scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git repo with conflicting branches
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a shared file on the initial commit
          echo "original content" > shared-file.txt
          git add shared-file.txt
          git commit -m "Add shared file"

          # Create base-branch and modify the shared file
          git checkout -b base-branch
          echo "base branch content" > shared-file.txt
          git add shared-file.txt
          git commit -m "Modify shared file on base"

          # Go back to the commit before base-branch changes and create feature-branch
          git checkout HEAD~1
          git checkout -b feature-branch
          echo "feature branch content" > shared-file.txt
          git add shared-file.txt
          git commit -m "Modify shared file on feature"
          # Both branches modified the same file differently — rebase will conflict

      - id: action
        uses: .
        with:
          branch: base-branch
          user-email: test@example.com
          user-name: Test User

      - name: Assert result is conflicts
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "conflicts" ]; then
            echo "FAIL: expected 'conflicts' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
