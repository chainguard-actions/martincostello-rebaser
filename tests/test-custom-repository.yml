name: Test rebase with custom repository path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a separate git repository at a custom path
        run: |
          REPO_PATH="$GITHUB_WORKSPACE/test-repo"
          mkdir -p "$REPO_PATH"
          cd "$REPO_PATH"

          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create initial commit on main
          echo "initial content" > README.md
          git add README.md
          git commit -m "Initial commit"
          git branch -M main

          # Create a feature branch with a new file (no conflict with main)
          git checkout -b feature
          echo "feature content" > feature.txt
          git add feature.txt
          git commit -m "Add feature"

          # Now feature is one commit ahead of main, rebase should succeed

      - id: action
        uses: .
        with:
          branch: main
          repository: ${{ github.workspace }}/test-repo
          user-email: test@example.com
          user-name: Test User

      - name: Assert result is success or upToDate
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "success" ] && [ "$ACTUAL" != "upToDate" ]; then
            echo "FAIL: expected 'success' or 'upToDate' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
