name: Test rebase with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .

      - name: Assert result output is set and valid
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: result output was empty"
            exit 1
          fi
          if [ "$ACTUAL" != "upToDate" ] && [ "$ACTUAL" != "success" ] && [ "$ACTUAL" != "conflicts" ] && [ "$ACTUAL" != "error" ]; then
            echo "FAIL: expected one of upToDate/success/conflicts/error, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: result=$ACTUAL"
