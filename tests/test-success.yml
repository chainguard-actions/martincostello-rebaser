name: Test rebase success scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git repo with diverged branches
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a base branch with an extra commit
          git checkout -b base-branch
          echo "base content" > base-file.txt
          git add base-file.txt
          git commit -m "Add base file"

          # Go back to the original commit and create a feature branch
          git checkout HEAD~1
          git checkout -b feature-branch
          echo "feature content" > feature-file.txt
          git add feature-file.txt
          git commit -m "Add feature file"
          # feature-branch now has a commit that is not on base-branch
          # and base-branch has a commit not on feature-branch — clean rebase possible

      - id: action
        uses: .
        with:
          branch: base-branch
          user-email: test@example.com
          user-name: Test User

      - name: Assert result is success
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected 'success' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
