name: Test custom user email and name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          user-email: 'custom-bot@example.com'
          user-name: 'Custom Bot'
      - name: Assert result is a valid value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            upToDate|success|conflicts|error)
              echo "PASS: result is a valid value '$ACTUAL'"
              ;;
            *)
              echo "FAIL: unexpected result '$ACTUAL'"
              exit 1
              ;;
          esac
