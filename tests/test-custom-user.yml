name: Test rebase with custom user
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          branch: main
          user-name: test-user
          user-email: test-user@example.com

      - name: Assert result is a valid value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "upToDate" ] && [ "$ACTUAL" != "success" ] && [ "$ACTUAL" != "conflicts" ] && [ "$ACTUAL" != "error" ]; then
            echo "FAIL: expected one of upToDate/success/conflicts/error, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
