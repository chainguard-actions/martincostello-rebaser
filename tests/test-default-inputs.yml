name: Test rebase with default user identity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a fresh git repo for testing default inputs
        run: |
          # Allow git to operate on any directory
          git config --global --add safe.directory '*'

          # Create a fresh git repo in a subdirectory
          mkdir -p "$GITHUB_WORKSPACE/test-repo"
          cd "$GITHUB_WORKSPACE/test-repo"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create initial commit on default branch
          echo "initial content" > initial.txt
          git add initial.txt
          git commit -m "Initial commit"

          # Create base-branch with an additional commit
          git checkout -b base-branch
          echo "base content" > base.txt
          git add base.txt
          git commit -m "Base commit"

          # Create feature-branch from base-branch with another commit
          git checkout -b feature-branch
          echo "feature content" > feature.txt
          git add feature.txt
          git commit -m "Feature commit"

          # Current branch is feature-branch
          git branch -v

      - id: action
        uses: .
        with:
          repository: ${{ github.workspace }}/test-repo
          branch: base-branch
          # user-email and user-name use defaults (github-actions[bot] identity)

      - name: Assert result is a valid value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            upToDate|success|conflicts|error)
              echo "PASS: result '$ACTUAL' is a valid rebase result"
              ;;
            *)
              echo "FAIL: unexpected result value '$ACTUAL'"
              exit 1
              ;;
          esac
