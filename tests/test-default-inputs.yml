name: Test rebase with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git repo with main branch at same commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a 'main' branch at the same commit as current HEAD
          # The action defaults to the repo's default_branch or 'main'
          git branch -f main HEAD

      - id: action
        uses: .
        # No inputs provided - uses all defaults
        # branch defaults to repo default_branch or 'main'
        # user-email and user-name use github-actions[bot] defaults

      - name: Assert result is a valid value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            upToDate|success|conflicts|error)
              echo "PASS: result is a valid value: $ACTUAL"
              ;;
            *)
              echo "FAIL: unexpected result value: '$ACTUAL'"
              exit 1
              ;;
          esac
