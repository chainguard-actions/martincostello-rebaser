name: Test basic rebase (up to date)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert result is upToDate
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "upToDate" ] && [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected 'upToDate' or 'success', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
