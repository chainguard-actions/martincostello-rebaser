name: Test basic usage - up to date
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert result is upToDate or success
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" = "upToDate" ] || [ "$ACTUAL" = "success" ]; then
            echo "PASS: result is '$ACTUAL'"
          else
            echo "FAIL: expected 'upToDate' or 'success', got '$ACTUAL'"
            exit 1
          fi
